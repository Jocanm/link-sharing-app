version: "3.8"

services:
  db:
    container_name: devlinks-container
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: local-user
      POSTGRES_DB: devlinks
      POSTGRES_PASSWORD: local-password
    volumes:
      - devlinks-data:/var/lib/postgresql/data

volumes:
  devlinks-data:
